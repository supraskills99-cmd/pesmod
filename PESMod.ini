; PESMod.ini
; Place this file in the same folder as the game executable.
; Settings here are read once at startup; changing them does not require
; recompiling the mod.

[general]
; Master switch. 1 = install hooks normally, 0 = load but stay completely
; inert (the game runs exactly as if PESMod were not present).
enabled = 1

[debug]
; PESMod always writes a PESMod.log next to the game executable.
; Set this to 1 to additionally open a live console window and echo log
; output to it in real time. Leave at 0 for normal play.
verbose_logging = 0

[main_menu_cards]
; PES 2011-style animated vertical card above the horizontal PES 6 menu.
enabled = 1

; Test build: visible immediately so we can confirm the Direct3D8 hook works.
start_visible = 1

; Temporary sync while the native PES 6 main-menu index is being identified.
; F9 toggles overlay, Left/Right selects, F10 reloads PNG assets.
debug_hotkeys = 1
initial_index = 0

; Screen-relative anchor. Defaults match the selected column in the supplied
; horizontal-menu mapping. The card bottom stays just above the icon.
anchor_x = 0.247
anchor_y = 0.785
card_width = 0.145
card_height = 0.445
gap = 0.014

; Animation timing / reflection.
animation_ms = 240
reflection_alpha = 0.28
