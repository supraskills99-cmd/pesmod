[menu_cards]
; Automatic main-menu behavior.
auto_main_menu = 1
start_visible = 0

; Card position, tuned from the user's 1280x800 PES2011-style reference.
anchor_x = 0.251
anchor_y = 0.783
card_width = 0.116
card_height = 0.188

; Animated selected card.
animation_ms = 360
frame_ms = 75
reflection_alpha = 0.30

; V18: custom PES2011-style bottom icon strip.
; The selected icon stays directly under the card while the strip slides.
custom_icon_strip = 1
icon_y = 0.895
icon_size = 0.052
icon_gap = 0.064
icon_mask_alpha = 218
