[menu_cards]
; Automatic main-menu behavior.
auto_main_menu = 1
start_visible = 0

; Card position, tuned from the user's 1280x800 PES2011-style reference.
anchor_x = 0.251
anchor_y = 0.783
card_width = 0.116
card_height = 0.188

; Animated selected card.
animation_ms = 360
frame_ms = 75
reflection_alpha = 0.30

; V19: custom icon strip aligned with the original horizontal menu row.
; The selected slot sits behind the card while neighboring icons slide beneath it.
custom_icon_strip = 1
icon_y = 0.715
icon_size = 0.050
icon_gap = 0.100
icon_mask_alpha = 228
