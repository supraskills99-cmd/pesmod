[menu_cards]
; Automatic main-menu behavior.
auto_main_menu = 1
start_visible = 0

; V22: proportions measured from the supplied PES2011 menu video.
; Narrow vertical selected tile: square lower selector + media panel above it.
anchor_x = 0.251
anchor_y = 0.772
card_width = 0.071
card_height = 0.258

; The reference transition is roughly 0.35 s from old panel to fully-open new panel.
animation_ms = 350
frame_ms = 75
reflection_alpha = 0.27

; Horizontal carousel below the fixed selected tile.
custom_icon_strip = 1
icon_y = 0.715
icon_size = 0.058
icon_gap = 0.075
icon_mask_alpha = 250
