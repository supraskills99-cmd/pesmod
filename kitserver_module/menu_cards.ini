[menu_cards]
; Automatic main-menu behavior.
auto_main_menu = 1
start_visible = 0

; V23: keep the existing PES2011 horizontal menu untouched.
; This module only draws the upper selected-panel extension above its fixed slot.
anchor_x = 0.251
anchor_y = 0.772
card_width = 0.071
card_height = 0.258

; PES2011-style close -> original menu moves -> upper panel opens.
animation_ms = 350
frame_ms = 75

; The original menu already owns the lower icon/reflection area.
reflection_alpha = 0.00

; IMPORTANT: do not draw, mask or replace the existing horizontal bar.
custom_icon_strip = 0
icon_y = 0.715
icon_size = 0.058
icon_gap = 0.075
icon_mask_alpha = 0
