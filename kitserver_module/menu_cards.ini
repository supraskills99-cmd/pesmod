[menu_cards]
; Automatic main-menu behavior.
auto_main_menu = 1
start_visible = 0

; Card position, tuned from the user's 1280x800 PES2011-style reference.
anchor_x = 0.251
anchor_y = 0.783
card_width = 0.116
card_height = 0.188

; PES2011-style synchronized card/carousel transition.
animation_ms = 300
frame_ms = 75
reflection_alpha = 0.30

; V21: clean PES2011-style carousel replacement.
; Original PES6 arrows/labels/icons are covered while the help bar stays visible.
custom_icon_strip = 1
icon_y = 0.715
icon_size = 0.058
icon_gap = 0.100
icon_mask_alpha = 250
