name: Build native kit fix

on:
  push:
    branches:
      - fix/native-kit-descriptors
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32 -DGAME_DIR=Z:/__PESMOD_NO_AUTODEPLOY__

      - name: Build PESMod.asi
        run: cmake --build build --config Release --parallel

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: PESMod-native-kit-fix
          path: build/Release/PESMod.asi
          if-no-files-found: error
