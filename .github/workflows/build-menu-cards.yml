name: Build animated menu prototype

on:
  push:
    branches:
      - feature/animated-main-menu
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate menu card assets
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_menu_cards.py

      - name: Configure Win32
        shell: pwsh
        run: cmake -S . -B build -A Win32 -DGAME_DIR="Z:/__pesmod_no_deploy__"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\PESMod\menu_cards | Out-Null
          Copy-Item build\Release\PESMod.asi package\PESMod.asi
          Copy-Item include\MinHook\lib\MinHook.x86.dll package\MinHook.x86.dll
          Copy-Item PESMod.ini package\PESMod.ini
          Copy-Item assets\menu_cards\*.png package\PESMod\menu_cards\

      - uses: actions/upload-artifact@v4
        with:
          name: PESMod-animated-main-menu-win32
          path: package
