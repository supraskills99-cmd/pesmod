name: Build Kitserver animated menu module

on:
  push:
    branches:
      - feature/kitserver-animated-menu
  workflow_dispatch:

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch V11 PES input capture
        run: python tools/patch_menu_v5.py

      - name: Patch V12 direct joystick fallback
        run: python tools/patch_menu_v12.py

      - name: Fix V12 WinMM config types
        run: python tools/patch_menu_v12_fix.py

      - name: Patch V13 PES2011 animation
        run: python tools/patch_menu_v13.py

      - name: Patch V15 safe input arbitration
        run: python tools/patch_menu_v15.py

      - name: Patch V16 animated card frames
        run: python tools/patch_menu_v16.py

      - name: Patch V18 sliding icon strip support
        run: python tools/patch_menu_v18.py

      - name: Fix V18 config types
        run: python tools/patch_menu_v18_fix.py

      - name: Patch V19 icon strip support
        run: python tools/patch_menu_v19.py

      - name: Patch V20 icon strip support
        run: python tools/patch_menu_v20.py

      - name: Patch V21 PES2011 synchronized transition
        run: python tools/patch_menu_v21.py

      - name: Patch V22 PES2011 upper-panel reveal
        run: python tools/patch_menu_v22.py

      - name: Patch V23 preserve original PES2011 menu bar
        run: python tools/patch_menu_v23.py

      - name: Generate PES2011 upper cards
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_kitserver_menu_cards.py
          python tools/generate_menu_icons_v18.py
          python tools/verticalize_cards_v22.py

      - name: Build Win32 Kitserver module
        shell: cmd
        run: >-
          cl /nologo /std:c++17 /EHsc /O2 /MD /LD
          kitserver_module\menu_cards.cpp
          /link /OUT:menucards.dll ole32.lib windowscodecs.lib user32.lib winmm.lib

      - name: Stage test package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package\kitserver\menu_cards | Out-Null
          Copy-Item menucards.dll package\kitserver\menucards.dll
          Copy-Item kitserver_module\menu_cards.ini package\kitserver\menu_cards.ini
          Copy-Item kitserver_module\INSTALL.txt package\INSTALL.txt
          Copy-Item build_menu_cards\*.png package\kitserver\menu_cards\

      - uses: actions/upload-artifact@v4
        with:
          name: PES6-Kitserver-Animated-Menu-Test
          path: package
