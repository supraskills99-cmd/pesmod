name: Build Racing EditProxy Win32
on:
  push:
    branches: [ chatgpt/racing-editproxy-persist-20260915 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Racing EditProxy patch
        shell: bash
        run: |
          base64 -d editproxy_main.patch.xz.b64 | xz -dc > editproxy_main.patch
          git apply --check editproxy_main.patch
          git apply editproxy_main.patch
      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release
      - name: Build Win32 Release
        run: cmake --build build --config Release
      - name: Collect build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/PESMod.asi artifact/PESMod_Racing251_EditData.asi
          Copy-Item include/MinHook/lib/MinHook.x86.dll artifact/MinHook.x86.dll
          Copy-Item PESMod.ini artifact/PESMod.ini
      - uses: actions/upload-artifact@v4
        with:
          name: PESMod-Racing-EditProxy
          path: artifact/*
