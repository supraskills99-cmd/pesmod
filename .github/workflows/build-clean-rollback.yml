name: Build Native Hidden Team 251 Strict
on:
  push:
    branches: [ chatgpt/racing-editproxy-persist-20260915 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply full PESMod source patch
        shell: bash
        run: |
          base64 -d editproxy_main.patch.xz.b64 | xz -dc > editproxy_main.patch
          git apply --check editproxy_main.patch
          git apply editproxy_main.patch
          python editproxy_crashfix.py
          python native251_hidden_team.py
          python native251_strict_stock.py
      - name: Verify strict stock 251 bypass
        shell: bash
        run: |
          echo '--- strict stock 251 checks ---'
          grep -n "if (teamId == 251)" src/hooks/custom_team_loader.cpp src/hooks/custom_logo_loader.cpp || true
          grep -n "teamID == 251u" src/hooks/club_hooks_squad_data.cpp || true
          grep -n "teamID == 251" src/hooks/club_hooks_kit_data.cpp || true
      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release
      - name: Build Win32 Release
        run: cmake --build build --config Release
      - name: Collect build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/PESMod.asi artifact/PESMod.asi
      - uses: actions/upload-artifact@v4
        with:
          name: PESMod-Racing-NativeHidden251-STRICT
          path: artifact/*
