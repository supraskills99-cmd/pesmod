name: Build Wakame 73 Native Test
on:
  push:
    branches: [ chatgpt/racing-editproxy-persist-20260915 ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PESMod patch and Wakame test
        shell: bash
        run: |
          base64 -d editproxy_main.patch.xz.b64 | xz -dc > editproxy_main.patch
          git apply --check editproxy_main.patch
          git apply editproxy_main.patch
          python editproxy_crashfix.py
          python native251_hidden_team.py
          python native251_strict_stock.py
          python native252_wakame_argentina.py
      - name: Verify native Wakame 252 test
        shell: bash
        run: |
          echo '--- Wakame 252 checks ---'
          grep -n "Native252Test" src/hooks/club_hooks_leagues.cpp
          grep -n "teamID == 252" src/hooks/club_hooks_kit_data.cpp src/hooks/club_hooks_squad_data.cpp || true
          grep -n "teamId == 252" src/hooks/custom_team_loader.cpp src/hooks/custom_logo_loader.cpp || true
      - name: Configure Win32 Release
        run: cmake -S . -B build -A Win32 -DCMAKE_BUILD_TYPE=Release
      - name: Build Win32 Release
        run: cmake --build build --config Release
      - name: Collect build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/Release/PESMod.asi artifact/PESMod.asi
      - uses: actions/upload-artifact@v4
        with:
          name: PESMod-Wakame73-Native252-LigaArgentina
          path: artifact/*
